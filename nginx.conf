server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # textos e código: sempre revalidar (edições em dados.js aparecem na hora)
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # vídeos (pasta videos/ montada como volume): cache de 7 dias, sem cair no index.html
    location ^~ /videos/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # imagens: cache de 7 dias
    location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
